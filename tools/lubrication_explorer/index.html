<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lubrication Force Explorer</title>
<link rel="stylesheet" href="./vendor/uPlot.min.css" />
<style>
  :root {
    --ground: #0b0f14; --panel: #121820; --panel-2: #18202a; --rail: #0e141b;
    --edge: #223040; --edge-soft: #1a2430;
    --text: #d7dee7; --muted: #7d8b9c;
    --cont: #34d3de; --eff: #ffb454; --marker: #c98bdb; --accent: #34d3de;
    --ok: #6ee7a0; --bad: #ff8fa3;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --nom: 0.085em; /* nomenclature tracking */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 78% -10%, #10202a 0%, transparent 60%),
      var(--ground);
    color: var(--text); display: flex; font: 13px/1.45 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Control desk (sidebar) ---- */
  #desk {
    width: 320px; min-width: 320px; height: 100vh; overflow-y: auto;
    background: linear-gradient(180deg, #0f151c, var(--rail));
    border-right: 1px solid var(--edge); padding: 16px 15px 40px;
  }
  .brand { margin-bottom: 18px; }
  .brand .eyebrow {
    font: 10px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); opacity: 0.85;
  }
  .brand h1 {
    font: 600 15px/1.2 var(--mono); letter-spacing: var(--nom); text-transform: uppercase;
    margin: 3px 0 0; color: var(--text);
  }
  .brand .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  .group { margin-bottom: 15px; }
  .group h3 {
    font: 10px/1.4 var(--mono); letter-spacing: 0.11em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 7px; padding-bottom: 4px;
    border-bottom: 1px solid var(--edge-soft);
  }
  .ctrl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 7px; margin: 6px 0; }
  .ctrl label { color: var(--text); font-size: 12px; }
  .ctrl input[type="range"] {
    grid-column: 1 / 2; width: 100%; accent-color: var(--accent); height: 2px;
  }
  .ctrl input[type="checkbox"] { justify-self: end; accent-color: var(--accent); width: 15px; height: 15px; }
  .ctrl select, .ctrl .num {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--edge);
    border-radius: 5px; padding: 3px 6px; font: 11px var(--mono);
  }
  .ctrl select { justify-self: end; }
  .ctrl .num { grid-column: 2 / 3; width: 86px; }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* ---- Screen array (main) ---- */
  #stage { flex: 1; height: 100vh; overflow-y: auto; padding: 14px 18px 40px; }

  #statusbar {
    display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
    padding: 10px 14px; margin-bottom: 14px;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--edge); border-radius: 10px;
  }
  #statusbar .title {
    font: 11px var(--mono); letter-spacing: var(--nom); text-transform: uppercase; color: var(--muted);
    margin-right: auto;
  }
  #readout { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #readout .stat { display: inline-flex; gap: 6px; align-items: baseline; font: 11px var(--mono); }
  #readout .stat b { color: var(--muted); font-weight: 400; letter-spacing: 0.04em; }
  #readout .stat i { color: var(--text); font-style: normal; }
  #readout .chk { font: 10px var(--mono); letter-spacing: 0.06em; padding: 2px 8px; border-radius: 5px; cursor: help; }
  #readout .chk.ok { background: rgba(110,231,160,0.12); color: var(--ok); border: 1px solid rgba(110,231,160,0.3); }
  #readout .chk.bad { background: rgba(255,143,163,0.12); color: var(--bad); border: 1px solid rgba(255,143,163,0.3); }

  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .toolbar .cluster { display: inline-flex; align-items: center; gap: 7px; }
  .toolbar .lbl { font: 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .toolbar label.chkline { font-size: 11px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .seg {
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--edge);
    padding: 3px 9px; font: 11px var(--mono); cursor: pointer;
  }
  .seg:first-child { border-radius: 6px 0 0 6px; }
  .seg:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .seg.on { color: var(--ground); background: var(--accent); border-color: var(--accent); }
  .toolbtn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--edge);
    border-radius: 6px; padding: 4px 11px; font: 11px var(--mono); cursor: pointer;
  }
  .toolbtn:hover { border-color: var(--accent); color: var(--accent); }
  .toolbtn.primary { background: rgba(52,211,222,0.09); border-color: rgba(52,211,222,0.35); }

  .panelrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .cell {
    background: linear-gradient(180deg, var(--panel), #0f151c);
    border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px 9px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.015);
    animation: rise 200ms ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .uroot { width: 100%; }
  .formula {
    font: 10.5px/1.4 var(--mono); color: #9db6d8; margin-top: 6px; padding: 6px 8px;
    background: rgba(52,211,222,0.05); border: 1px solid var(--edge-soft); border-radius: 6px;
    min-height: 15px; word-break: break-word;
  }

  /* ---- uPlot dark theme overrides ---- */
  .uplot { font-family: var(--mono); color: var(--text); width: 100%; }
  .u-title {
    font: 11px var(--mono) !important; letter-spacing: var(--nom); text-transform: uppercase;
    color: var(--text); font-weight: 600; padding-bottom: 2px;
  }
  .u-legend { font: 10.5px var(--mono); color: var(--muted); margin-top: 2px; }
  .u-legend .u-value { color: var(--text); }
  .u-legend .u-series th { font-weight: 400; }
  .u-legend .u-series { padding: 0 6px; }
  .u-select { background: rgba(52,211,222,0.12); border: 1px solid rgba(52,211,222,0.35); }
  .u-cursor-x, .u-cursor-y { border-color: rgba(52,211,222,0.5) !important; }

  @media (max-width: 1150px) { .panelrow { grid-template-columns: 1fr; } }
  @media (max-width: 720px) {
    body { flex-direction: column; }
    #desk { width: 100%; min-width: 0; height: auto; max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--edge); }
    #stage { height: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .cell { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
  <aside id="desk">
    <div class="brand">
      <div class="eyebrow">Kroupa 2016 · viscous squeeze-film model</div>
      <h1>Lubrication Force Explorer</h1>
      <div class="sub">Analytic pair / wall force &amp; torque laws vs gap — a model bench, not a simulation.</div>
    </div>
    <div id="controls"></div>
  </aside>

  <section id="stage">
    <div id="statusbar">
      <span class="title">Scope array — force / torque vs gap</span>
      <div id="readout"></div>
    </div>
    <div class="toolbar" style="margin-bottom:14px">
      <span class="cluster"><span class="lbl">X</span><span id="xmode" class="segset"></span></span>
      <span class="cluster"><span class="lbl">Y</span><span id="ymode" class="segset"></span></span>
      <label class="chkline"><input type="checkbox" id="normToggle" /> Fig.7 dimensionless (continuous)</label>
      <button id="visualDefaultsBtn" class="toolbtn primary"
              title="Restore the explorer's visualization-oriented parameters and plot view">Visualization defaults</button>
      <button id="engineDefaultsBtn" class="toolbtn"
              title="Load the PE lubrication engine defaults; plot-only geometry and kinematics are unchanged">Set engine defaults</button>
      <button id="resetBtn" class="toolbtn" title="Double-click any plot, or here, to reset zoom on all panels">Reset view</button>
      <span class="lbl" style="opacity:.7">drag = box-zoom · wheel = zoom · shift+wheel = zoom Y</span>
    </div>
    <div id="grid"></div>
  </section>

  <script src="./vendor/uPlot.iife.min.js"></script>
  <script src="./lubforces.js"></script>
  <script src="./charts.js"></script>
  <script src="./app.js"></script>
</body>
</html>
